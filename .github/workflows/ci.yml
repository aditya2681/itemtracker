name: Verify frontend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node scripts/netlify-build.mjs
        env:
          CONTEXT: production
          VITE_CONVEX_URL: https://benevolent-mosquito-853.eu-west-1.convex.cloud
          VITE_BASE_PATH: /
